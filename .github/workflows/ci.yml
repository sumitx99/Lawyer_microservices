name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17   # same major version and extension as Supabase
        env:
          POSTGRES_USER: lexaior
          POSTGRES_PASSWORD: lexaior
          POSTGRES_DB: lexaior
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lexaior"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://lexaior:lexaior@localhost:5432/lexaior
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pymicroservices/requirements-dev.lock
      - run: pip install -r pymicroservices/requirements-dev.lock
      - name: Migrations apply cleanly
        env:
          DATABASE_URL: postgresql://lexaior:lexaior@localhost:5432/lexaior
          ENVIRONMENT: test
          AUTH_PROVIDER: dev
          VALKEY_PASSWORD: ci-cache
          STORAGE_ACCESS_KEY: ci-access
          STORAGE_SECRET_KEY: ci-secret
        run: python -m pymicroservices.app.migrate upgrade
      - name: Unit tests (RAG contracts, validation, retrieval)
        run: python -m pytest tests/unit -q
      - name: API tests (Postgres, dev sign-in, stand-in for S3 storage)
        run: python -m pytest tests/api -q
